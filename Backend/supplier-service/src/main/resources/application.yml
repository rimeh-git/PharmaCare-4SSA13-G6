server:
  port: ${PORT:8085}

spring:
  application:
    name: supplier-service
  # ---------- Base MySQL (XAMPP : user root, sans mot de passe) ----------
  datasource:
    url: jdbc:mysql://localhost:3306/supplier_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

# ---------- Client Eureka (2 serveurs Eureka) ----------
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/,http://localhost:8762/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    # id unique par port -> 2 instances visibles dans le dashboard
    instance-id: ${spring.application.name}:${server.port}

# ---------- Actuator ----------
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: Supplier Service
    description: Gestion des fournisseurs et des approvisionnements - PharmaCare
    version: 1.0.0
    responsable: Yassmine Abbes

---
# ---------- Profil h2 : tester sans XAMPP ----------
# Lancer avec : -Dspring-boot.run.profiles=h2
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:supplier_db
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
